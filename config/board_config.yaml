board:
  origin:
    x: 0.15  # 150mm from base
    y: -0.2  # 200mm to the left
    z: 0.015 # At table height
  square_size: 0.03  # 30mm squares
  piece_height: 0.103 # 103mm piece height
  hover_height: 0.10 # 100mm above pieces for clearance

capture_zone:
  origin:
    x: 0.15  # Same x-coordinate as board origin
    y: 0.1   # 100mm to the right of board origin
  dimensions:
    width: 0.09   # 90mm wide (3 squares)
    height: 0.24  # 240mm tall (8 squares)
  grid:
    rows: 8  # One row per rank
    cols: 3  # Three columns for captured pieces

robot:
  movement:
    max_velocity_scaling: 0.4
    max_acceleration_scaling: 0.3
    planning_time: 5.0
    planning_attempts: 10
    replan_attempts: 10
    replan_delay: 0.1
  # Half-extent of the planning workspace cube, in metres (min/max +/- this).
  workspace_bounds: 1.0
  # Timeouts (seconds) for spinning on MoveGroup / gripper service futures.
  goal_timeout_sec: 65.0
  service_timeout_sec: 3.0
  action_server_timeout_sec: 5.0
  gripper_request_timeout_sec: 2.0
  # Physical settle waits (seconds) after a gripper actuation.
  gripper_settle_sec: 1.0
  gripper_sim_settle_sec: 0.5
  # Optional: force simulation mode without an interactive prompt.
  # Env var CHESS_SIM_MODE (1/0) takes precedence; leave unset to prompt on a TTY.
  # simulation_mode: false

visualization:
  # How long to wait for an RViz subscriber at startup before continuing
  # without it (RViz is optional, not a startup gate).
  wait_timeout_sec: 10